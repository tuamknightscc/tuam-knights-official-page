<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22282d">
    <meta name="description" content="Tuam Knights Cricket Club, affiliated with Connacht Cricket Union and Cricket Ireland. Find our indoor location, get in touch, and follow the club.">
    <title>Tuam Knights Cricket Club</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="location" viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
        <symbol id="email" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></symbol>
        <symbol id="instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol>
        <symbol id="youtube" viewBox="0 0 24 24"><path d="M21 7.5a3 3 0 0 0-2-2C17 5 12 5 12 5s-5 0-7 .5a3 3 0 0 0-2 2 25 25 0 0 0 0 9 3 3 0 0 0 2 2c2 .5 7 .5 7 .5s5 0 7-.5a3 3 0 0 0 2-2 25 25 0 0 0 0-9Z"/><path d="m10 9 5 3-5 3Z"/></symbol>
    </svg>

    <header class="top-bar">
        <a class="wordmark" href="./" aria-label="Tuam Knights Cricket Club home">TK<span>CC</span><span class="wordmark-dot" aria-hidden="true">.</span></a>
        <nav class="contact-links" aria-label="Contact and social media">
            <a class="contact-link" href="https://www.google.com/maps/place/St+pats+Gym/@53.5125178,-8.8477476,17z/data=!3m1!4b1!4m6!3m5!1s0x485bf6b3fa173b69:0x1603b2213dcd50ce!8m2!3d53.5125146!4d-8.8451727!16s%2Fg%2F11f404q7t8?entry=ttu&amp;g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" aria-label="Indoor location: St Pats Gym, Tuam (opens in a new tab)">
                <svg class="icon" aria-hidden="true"><use href="#location"/></svg>
                <span><span class="contact-label">Indoor location</span>St Pats Gym, Tuam</span>
            </a>
            <a class="contact-link email-link" href="mailto:contact.tuamknightscc@gmail.com">
                <svg class="icon" aria-hidden="true"><use href="#email"/></svg>
                <span><span class="contact-label">Email us</span>contact.tuamknightscc@gmail.com</span>
            </a>
            <div class="social-links">
                <a href="https://www.youtube.com/@TuamKnightsCricketClub" target="_blank" rel="noopener noreferrer" aria-label="Tuam Knights on YouTube (opens in a new tab)"><svg class="icon" aria-hidden="true"><use href="#youtube"/></svg></a>
                <a href="https://www.instagram.com/tuamknightscricketclub" target="_blank" rel="noopener noreferrer" aria-label="Tuam Knights on Instagram (opens in a new tab)"><svg class="icon" aria-hidden="true"><use href="#instagram"/></svg></a>
            </div>
        </nav>
    </header>

    <main>
        <section class="club-introduction" aria-labelledby="club-name">
            <div class="club-copy">
                <p class="eyebrow"><span aria-hidden="true"></span> Tuam, County Galway, Ireland</p>
                <h1 id="club-name">Tuam Knights<span>Cricket Club</span></h1>
                <div class="affiliations">
                    <p class="eyebrow">Affiliated with</p>
                    <p>Connacht Cricket Union<span class="affiliation-divider" aria-hidden="true">/</span>Cricket Ireland</p>
                </div>
            </div>
            <div class="club-crest">
                <img src="images/logo.png" alt="Tuam Knights Cricket Club crest: an armoured knight holding a cricket bat, established 2022" width="1024" height="1045" fetchpriority="high">
            </div>
        </section>
    </main>
    <footer><span>Tuam Knights Cricket Club</span><span>Tuam · County Galway</span></footer>
</body>
</html>
